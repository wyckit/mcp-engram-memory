name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  telemetry-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish the executable under test
        run: dotnet publish src/McpEngramMemory/McpEngramMemory.csproj -c Release -f net8.0 -p:TargetFrameworks=net8.0 -o artifacts/telemetry-server
      - name: Native load ordering and real inference without inherited suppression
        run: python scripts/validate-telemetry.py --server artifacts/telemetry-server/McpEngramMemory.dll --output artifacts/telemetry-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telemetry-${{ matrix.os }}
          path: |
            artifacts/telemetry-validation/*.json
            artifacts/telemetry-validation/*.log
            artifacts/telemetry-validation/*.etl
            artifacts/telemetry-validation/*.xml

  source-installation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, sdk: '8', shell: powershell }
          - { os: windows-latest, sdk: '10', shell: pwsh }
          - { os: ubuntu-latest, sdk: '9', shell: bash }
          - { os: macos-15, sdk: '8', shell: bash }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            ${{ matrix.sdk }}.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh, repeated and malformed configuration with real installed command
        run: python scripts/validate-source-installation.py --sdk ${{ matrix.sdk }} --shell ${{ matrix.shell }} --output artifacts/source-installation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-installation-${{ matrix.os }}-${{ matrix.sdk }}
          path: |
            artifacts/source-installation/*.log
            artifacts/source-installation/*.json

  installed-package-upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pack unpublished candidate
        run: dotnet pack src/McpEngramMemory/McpEngramMemory.csproj -c Release -p:Version=2.1.0-validation.${{ github.run_id }}.${{ github.run_attempt }} -o artifacts/feed
      - name: Upgrade published 2.0.0 with JSON, SQLite and external SQLite
        run: python scripts/validate-installation.py --package-source artifacts/feed --version 2.1.0-validation.${{ github.run_id }}.${{ github.run_attempt }} --output artifacts/installed-upgrade
      - name: Build and restart the Docker image with a durable volume
        if: runner.os == 'Linux'
        run: |
          docker build -t engram-validation .
          python scripts/validate-container.py --image engram-validation --output artifacts/container-validation
      - name: Publisher dry run preserves existing validation evidence
        if: runner.os == 'Windows'
        run: python scripts/validate-publisher.py --repo .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-upgrade-${{ matrix.os }}
          path: |
            artifacts/installed-upgrade/*.log
            artifacts/installed-upgrade/*.json
            artifacts/container-validation/*.log
            artifacts/container-validation/*.json
            artifacts/publisher-check/

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore McpEngramMemory.slnx

      - name: Build
        run: dotnet build McpEngramMemory.slnx --no-restore -c Release

      - name: Test (excluding separate benchmark lanes)
        # Capture the active test sequence and a mini dump before terminating a hung
        # host. This is outside the tests' existing 60s/180s worker deadlines.
        run: dotnet test McpEngramMemory.slnx --no-build -c Release --logger "trx;LogFilePrefix=results" --filter "Category!=MSA&Category!=RecallScale&Category!=IndependentRecall" --blame-hang-timeout 5m --blame-hang-dump-type mini

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/recall-realistic-*.json
            **/TestResults/recall-noisy-*.json
            **/TestResults/restart-*.json
            **/TestResults/**/Sequence*.xml
            **/TestResults/**/*.dmp

      # Benchmark regression gate (T7): now STATISTICAL. The script delegates to
      # the C# gate (built Release above): absolute floors (Recall>=0.20,
      # MRR>=0.20, nDCG>=0.15, outcome>=0.20) stay as sanity nets, and drift is
      # gated by a Holm-corrected one-sided paired t-test (alpha 0.05) with an
      # MDE of 0.02 over per-query deltas. Gating benchmarks/baselines against
      # themselves yields zero deltas (p=1), so this job effectively asserts
      # floors + parseability, same as before. jq remains only for the legacy
      # bash fallback path.
      - name: Benchmark regression gate (pinned baselines)
        run: bash scripts/check-benchmark-regression.sh benchmarks/baselines

  recall-scale-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENGRAM_RECALL_EVAL_OUTPUT: ${{ github.workspace }}/artifacts/recall-scale
      ENGRAM_EVAL_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Evaluate 1,000 and 5,000 memories
        run: dotnet test tests/McpEngramMemory.Tests/McpEngramMemory.Tests.csproj -c Release -f net8.0 --filter "Category=RecallScale" --logger "trx;LogFileName=recall-scale.trx"
      - name: Require complete reports and zero declared recall blockers
        run: python scripts/check-noisy-recall.py artifacts/recall-scale --release
      - name: Test report gate
        run: python -m unittest discover -s scripts/tests -p test_noisy_recall_gate.py
      - name: Upload scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recall-scale-results
          path: |
            artifacts/recall-scale/
            **/TestResults/recall-scale.trx

  independent-recall-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENGRAM_INDEPENDENT_OUTPUT: ${{ github.workspace }}/artifacts/independent-recall
      ENGRAM_EVAL_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test evidence validator
        run: python -m unittest discover -s scripts/tests -p test_independent_recall_gate.py
      - name: Measure frozen questions and concurrent JSON/SQLite workloads
        run: dotnet test tests/McpEngramMemory.Tests/McpEngramMemory.Tests.csproj -c Release -f net8.0 --filter "Category=IndependentRecall" --logger "trx;LogFileName=independent-recall.trx" --blame-hang-timeout 5m --blame-hang-dump-type mini
      # The original independent quality gaps are fixed. Enforce every frozen
      # criterion alongside the scope/load checks and the strict scale gate above.
      - name: Require complete independent evidence and zero recall blockers
        run: python scripts/check-independent-recall.py artifacts/independent-recall --release
      - name: Upload independent validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-recall-results
          path: |
            artifacts/independent-recall/
            **/TestResults/independent-recall.trx
            **/TestResults/**/Sequence*.xml
            **/TestResults/**/*.dmp

  pack:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore McpEngramMemory.slnx

      - name: Pack Core library
        run: dotnet pack src/McpEngramMemory.Core/McpEngramMemory.Core.csproj -c Release -o ./artifacts

      - name: Pack ONNX synthesis library
        run: dotnet pack src/McpEngramMemory.Synthesis.Onnx/McpEngramMemory.Synthesis.Onnx.csproj -c Release -o ./artifacts

      - name: Pack global tool
        run: dotnet pack src/McpEngramMemory/McpEngramMemory.csproj -c Release -o ./artifacts

      - name: Verify package versions
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          names = ('McpEngramMemory.Core', 'McpEngramMemory.Synthesis.Onnx', 'McpEngramMemory')
          versions = {name: ET.parse(f'src/{name}/{name}.csproj').findtext('.//Version') for name in names}
          assert len(set(versions.values())) == 1, versions
          for name, version in versions.items():
              assert Path(f'artifacts/{name}.{version}.nupkg').is_file(), (name, version)

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
