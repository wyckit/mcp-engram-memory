name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore McpEngramMemory.slnx

      - name: Build
        run: dotnet build McpEngramMemory.slnx --no-restore -c Release

      - name: Test (excluding separate benchmark lanes)
        run: dotnet test McpEngramMemory.slnx --no-build -c Release --logger "trx;LogFilePrefix=results" --filter "Category!=MSA&Category!=RecallScale"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/recall-realistic-*.json
            **/TestResults/recall-noisy-*.json
            **/TestResults/restart-*.json

      # Benchmark regression gate (T7): now STATISTICAL. The script delegates to
      # the C# gate (built Release above): absolute floors (Recall>=0.20,
      # MRR>=0.20, nDCG>=0.15, outcome>=0.20) stay as sanity nets, and drift is
      # gated by a Holm-corrected one-sided paired t-test (alpha 0.05) with an
      # MDE of 0.02 over per-query deltas. Gating benchmarks/baselines against
      # themselves yields zero deltas (p=1), so this job effectively asserts
      # floors + parseability, same as before. jq remains only for the legacy
      # bash fallback path.
      - name: Benchmark regression gate (pinned baselines)
        run: bash scripts/check-benchmark-regression.sh benchmarks/baselines

  recall-scale-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENGRAM_RECALL_EVAL_OUTPUT: ${{ github.workspace }}/artifacts/recall-scale
      ENGRAM_EVAL_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Evaluate 1,000 and 5,000 memories
        run: dotnet test tests/McpEngramMemory.Tests/McpEngramMemory.Tests.csproj -c Release -f net8.0 --filter "Category=RecallScale" --logger "trx;LogFileName=recall-scale.trx"
      - name: Require complete reports and zero declared recall blockers
        run: python scripts/check-noisy-recall.py artifacts/recall-scale --release
      - name: Test report gate
        run: python -m unittest discover -s scripts/tests -p test_noisy_recall_gate.py
      - name: Upload scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recall-scale-results
          path: |
            artifacts/recall-scale/
            **/TestResults/recall-scale.trx

  pack:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore McpEngramMemory.slnx

      - name: Pack Core library
        run: dotnet pack src/McpEngramMemory.Core/McpEngramMemory.Core.csproj -c Release -o ./artifacts

      - name: Pack ONNX synthesis library
        run: dotnet pack src/McpEngramMemory.Synthesis.Onnx/McpEngramMemory.Synthesis.Onnx.csproj -c Release -o ./artifacts

      - name: Pack global tool
        run: dotnet pack src/McpEngramMemory/McpEngramMemory.csproj -c Release -o ./artifacts

      - name: Verify package versions
        shell: bash
        run: |
          test -f ./artifacts/McpEngramMemory.Core.2.0.0.nupkg
          test -f ./artifacts/McpEngramMemory.Synthesis.Onnx.2.0.0.nupkg
          test -f ./artifacts/McpEngramMemory.2.0.0.nupkg

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
