name: MSA Benchmarks

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Artifact writers (BenchmarkTools, ColdStartBenchmarkRunner, MrcrPilotCommand)
      # default their output root to Directory.GetCurrentDirectory()/benchmarks. Under
      # `dotnet test` that is the test output directory, not the repo root, so anything
      # they emit lands where the regression gate never looks. Pin it explicitly.
      BENCHMARK_ARTIFACTS_PATH: ${{ github.workspace }}/benchmarks
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore McpEngramMemory.slnx

      - name: Build
        run: dotnet build McpEngramMemory.slnx --no-restore -c Release

      - name: Run MSA benchmarks
        run: dotnet test tests/McpEngramMemory.Tests/McpEngramMemory.Tests.csproj --no-build -c Release --filter "Category=MSA" --logger "trx;LogFileName=msa-benchmarks.trx" -f net8.0

      # Benchmark regression gate (T7): compare artifacts produced by THIS run
      # against the documented floors (Recall>=0.20, MRR>=0.20, nDCG>=0.15) and
      # against the pinned baselines with a 0.02 tolerance. Non-zero exit fails
      # the job. jq is preinstalled on GitHub-hosted ubuntu runners.
      #
      # This deliberately does NOT fall back to benchmarks/baselines. Baselines are
      # static committed files, so gating them is in-sample by construction: it can
      # never reveal a regression in system behaviour, only catch someone editing a
      # baseline downward. A gate that always passes is a ceremonial checkbox; a
      # gate that always fails is a ceremonial alarm. Both carry zero information.
      #
      # The previous `target="${latest:-benchmarks/baselines}"` form never reached
      # its fallback, because ten dated folders are committed to the repo — so it
      # silently gated a stale 2026-05-07 folder every night and failed for 40 days
      # while the benchmarks themselves passed 16/16.
      - name: Benchmark regression gate
        run: |
          today="benchmarks/$(date -u +%F)"
          if [ ! -d "$today" ]; then
            echo "::error::MSA benchmarks produced no artifact at ${today}."
            echo ""
            echo "The nightly gates metrics generated by this run. Falling back to the"
            echo "pinned baselines would be in-sample and meaningless, so a missing"
            echo "artifact is a hard failure rather than something to route around."
            echo ""
            echo "Likely causes:"
            echo "  1. The MSA benchmarks skipped because no live LLM endpoint was"
            echo "     reachable from the runner (several bail out early and still pass)."
            echo "  2. An artifact writer resolved a different root. BENCHMARK_ARTIFACTS_PATH"
            echo "     is set to '${BENCHMARK_ARTIFACTS_PATH}' for this job."
            echo ""
            echo "Dated folders currently present:"
            find benchmarks -maxdepth 1 -type d -name '[0-9][0-9][0-9][0-9]-*' | sort
            exit 1
          fi
          echo "Gating benchmark artifacts in: ${today}"
          bash scripts/check-benchmark-regression.sh "$today"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msa-benchmark-results
          path: '**/TestResults/*.trx'
